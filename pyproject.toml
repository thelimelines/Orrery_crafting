[project]
name = "orrery-crafting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numba",
    "numpy>=1.26,<2.0",
    "pyside6>=6.6.0",
    "PyOpenGL>=3.1.7",
    "pyright>=1.1.408",
    "scipy>=1.17.0",
    "spiceypy>=5.1.2",
]

[project.scripts]
orrery = "orrery_app.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
orrery_app = ["data/textures/**/*", "data/kernels/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
ignore = ["E501"]
